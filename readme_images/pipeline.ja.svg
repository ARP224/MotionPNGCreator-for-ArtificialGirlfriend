<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" font-family="'Hiragino Sans','Yu Gothic UI',Meiryo,system-ui,sans-serif">
  <title>MotionPNGCreatorの全体フロー</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a817c"/>
    </marker>
  </defs>

  <!-- 背景（塗り込み・ダークモード対策） -->
  <rect x="0.5" y="0.5" width="1279" height="539" fill="#ffffff" stroke="#e8e2de"/>

  <!-- タイトル（左端アイコン: 3連チェブロン） -->
  <g fill="#7a6f68">
    <path d="M394 15 L404 25 L394 35 L398 25 z"/>
    <path d="M407 15 L417 25 L407 35 L411 25 z"/>
    <path d="M420 15 L430 25 L420 35 L424 25 z"/>
  </g>
  <text x="442" y="31" font-size="15" fill="#7a6f68" font-weight="bold">MotionPNGCreatorの全体フロー ── 画像1枚から、AGで動く素材まで</text>

  <!-- ローカルPCの境界 -->
  <rect x="28" y="130" width="984" height="380" rx="12" fill="none" stroke="#cfc7c1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="46" y="501" font-size="12" fill="#8b7f78">あなたのPC（ローカル処理・NVIDIA GPU）</text>

  <!-- Vidu API（クラウド） -->
  <rect x="390" y="50" width="560" height="62" rx="10" fill="#faf8f7" stroke="#b8ada6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="670" y="77" font-size="13.5" fill="#7a6f68" text-anchor="middle" font-weight="bold">Vidu API（クラウド・従量課金）</text>
  <text x="670" y="100" font-size="11.5" fill="#9a8f88" text-anchor="middle">画像＋プロンプトを受け取り、動画を生成して返す</text>

  <!-- ============ 1 セットアップ ============ -->
  <rect x="48" y="150" width="230" height="270" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <circle cx="70" cy="172" r="11" fill="#c65b84"/>
  <text x="70" y="176.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="88" y="178" font-size="17" fill="#3f3833" font-weight="bold">セットアップ</text>
  <text x="64" y="220" font-size="13" fill="#5a5049">キャラクター画像（1キャラ1枚）</text>
  <text x="74" y="244" font-size="12.5" fill="#7a6f68">・ファイル名 = キャラクター名</text>
  <text x="74" y="268" font-size="12.5" fill="#7a6f68">・縦横比 9:16</text>
  <text x="74" y="292" font-size="12.5" fill="#7a6f68">・ワークフォルダに入れる</text>
  <text x="64" y="322" font-size="13" fill="#5a5049">SAM3モデル（sam3.pt）</text>
  <text x="74" y="346" font-size="12.5" fill="#7a6f68">・Sam3/ フォルダに配置</text>
  <text x="64" y="376" font-size="13" fill="#5a5049">Vidu APIキー（有料）</text>
  <text x="74" y="400" font-size="12.5" fill="#7a6f68">・Viduのサイトから取得</text>

  <line x1="278" y1="182" x2="314" y2="182" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ============ 2 素材準備 ============ -->
  <rect x="318" y="150" width="320" height="300" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <circle cx="340" cy="172" r="11" fill="#c65b84"/>
  <text x="340" y="176.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="358" y="178" font-size="16" fill="#3f3833" font-weight="bold">素材準備（asset_preparer.py）</text>
  <text x="336" y="218" font-size="13" fill="#5a5049">① 720×1280 へリスケール（上書き）</text>
  <text x="336" y="243" font-size="13" fill="#5a5049">② 背景を緑 #00FF00 に置換（上書き）</text>
  <text x="336" y="268" font-size="13" fill="#5a5049">③ SAM3で目・口を検出 → face_info.json</text>
  <text x="336" y="293" font-size="13" fill="#5a5049">④ Viduで口抽出用の仮動画を生成</text>
  <text x="336" y="318" font-size="13" fill="#5a5049">⑤ 仮動画から口素材を抽出</text>
  <text x="350" y="338" font-size="12.5" fill="#7a6f68">→ mouth/（open・closed・half.png）</text>
  <text x="336" y="363" font-size="13" fill="#5a5049">⑥ 口をブラシで消す（上書き）</text>
  <text x="336" y="388" font-size="13" fill="#5a5049">⑦ 検証 → Video Generator を起動</text>
  <text x="336" y="416" font-size="12" fill="#9a8f88">キャラクターごとの材料一式が</text>
  <text x="336" y="434" font-size="12" fill="#9a8f88">ワークフォルダにそろう</text>

  <!-- 素材準備④ と Vidu の通信 -->
  <line x1="466" y1="150" x2="466" y2="116" stroke="#8a817c" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="490" y1="114" x2="490" y2="146" stroke="#8a817c" stroke-width="1.8" marker-end="url(#ah)"/>

  <line x1="638" y1="182" x2="674" y2="182" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ============ 3 動画量産 ============ -->
  <rect x="678" y="150" width="310" height="340" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <circle cx="700" cy="172" r="11" fill="#c65b84"/>
  <text x="700" y="176.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="718" y="178" font-size="16" fill="#3f3833" font-weight="bold">動画量産（video_generator.py）</text>

  <rect x="694" y="196" width="278" height="100" rx="8" fill="#f6f1ee" stroke="#cbc1ba" stroke-width="1.5"/>
  <text x="708" y="219" font-size="12.5" fill="#5a5049" font-weight="bold">Phase1: Viduへ一括発注</text>
  <text x="708" y="243" font-size="12" fill="#7a6f68">・キャラクター × プロンプト = 動画1本</text>
  <text x="708" y="265" font-size="12" fill="#7a6f68">・同時実行枠まで並列</text>
  <text x="708" y="287" font-size="12" fill="#7a6f68">・→ original/ へダウンロード</text>

  <line x1="833" y1="296" x2="833" y2="312" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="694" y="316" width="278" height="122" rx="8" fill="#f6f1ee" stroke="#cbc1ba" stroke-width="1.5"/>
  <text x="708" y="339" font-size="12.5" fill="#5a5049" font-weight="bold">Phase2: トラッキング＆口消し</text>
  <text x="708" y="363" font-size="12" fill="#7a6f68">・全フレームの両目をSAM3で検出（1本ずつ）</text>
  <text x="708" y="385" font-size="12" fill="#7a6f68">・口消し → 背景透過（クロマキー）</text>
  <text x="708" y="407" font-size="12" fill="#7a6f68">・→ {ジョブID}.webm（VP9透過動画）</text>
  <text x="708" y="429" font-size="12" fill="#7a6f68">　＋ {ジョブID}.json（口の位置データ）</text>

  <text x="698" y="466" font-size="12.5" fill="#5a5049">確認: プレイヤーで再生し、不良品を間引く</text>

  <!-- 動画量産 Phase1 と Vidu の通信 -->
  <line x1="820" y1="150" x2="820" y2="116" stroke="#8a817c" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="844" y1="114" x2="844" y2="146" stroke="#8a817c" stroke-width="1.8" marker-end="url(#ah)"/>

  <line x1="988" y1="182" x2="1036" y2="182" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ============ 4 AG本体へ ============ -->
  <rect x="1040" y="150" width="212" height="250" rx="10" fill="#fbeef3" stroke="#d98cab" stroke-width="2"/>
  <circle cx="1062" cy="172" r="11" fill="#c65b84"/>
  <text x="1062" y="176.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="1080" y="178" font-size="17" fill="#8c3a5c" font-weight="bold">AG本体へ</text>
  <text x="1056" y="202" font-size="11.5" fill="#9a8f88">ArtificialGirlfriend（別リポジトリ）</text>
  <text x="1056" y="230" font-size="12.5" fill="#5a5049">キャラクターフォルダを</text>
  <text x="1056" y="252" font-size="12.5" fill="#5a5049">丸ごとコピー →</text>
  <text x="1056" y="274" font-size="12.5" fill="#5a5049">MotionPNGPlayer\Asset\</text>
  <text x="1056" y="304" font-size="12.5" fill="#5a5049">キャラクターに</text>
  <text x="1056" y="326" font-size="12.5" fill="#5a5049">「Motionフォルダ名」を設定</text>
  <text x="1056" y="356" font-size="12.5" fill="#5a5049">「Appear」で</text>
  <text x="1056" y="378" font-size="12.5" fill="#5a5049">彼女が動き出す</text>

  <!-- 矢印ラベル（白halo・後描き） -->
  <text x="296" y="198" font-size="12" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">画像入りワークフォルダ</text>
  <text x="656" y="198" font-size="12" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">素材一式</text>
  <text x="1012" y="198" font-size="12" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">完成素材</text>
  <text x="458" y="138" font-size="11.5" fill="#8b7f78" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">発注</text>
  <text x="498" y="138" font-size="11.5" fill="#8b7f78" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">仮動画</text>
  <text x="812" y="138" font-size="11.5" fill="#8b7f78" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">発注（並列）</text>
  <text x="852" y="138" font-size="11.5" fill="#8b7f78" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">動画</text>
</svg>
