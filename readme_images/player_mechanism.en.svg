<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="545" viewBox="0 0 1280 545" font-family="'Segoe UI',system-ui,sans-serif">
  <title>MotionPNGPlayer lip-sync compositing</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a817c"/>
    </marker>
  </defs>

  <!-- Background (filled; dark-mode safety) -->
  <rect x="0.5" y="0.5" width="1279" height="544" fill="#ffffff" stroke="#e8e2de"/>

  <!-- Title (icon: two stacked layers) -->
  <g fill="none" stroke="#7a6f68" stroke-width="2.5">
    <rect x="358" y="13" width="16" height="14" rx="2"/>
    <rect x="366" y="20" width="16" height="14" rx="2" fill="#ffffff"/>
  </g>
  <text x="396" y="31" font-size="16" fill="#7a6f68" font-weight="bold">MotionPNGPlayer lip-sync compositing ── three assets become a talking character</text>

  <!-- ============ Motion Folder ============ -->
  <rect x="48" y="80" width="300" height="300" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <text x="66" y="114" font-size="19" fill="#3f3833" font-weight="bold">Motion Folder</text>
  <text x="66" y="140" font-size="13" fill="#9a8f88">the assets built in MPC's Step 1 &amp; 2</text>
  <text x="66" y="174" font-size="14.5" fill="#5a5049">Transparent looping video (.webm)</text>
  <text x="76" y="197" font-size="13" fill="#7a6f68">・no mouth → no overlap with the sprite</text>
  <text x="76" y="219" font-size="13" fill="#7a6f68">・carries alpha (transparency)</text>
  <text x="66" y="251" font-size="14.5" fill="#5a5049">Mouth position data (.json)</text>
  <text x="76" y="274" font-size="13" fill="#7a6f68">・mouth position/size/tilt per frame</text>
  <text x="76" y="296" font-size="13" fill="#7a6f68">・the mouth follows the moving face</text>
  <text x="66" y="328" font-size="14.5" fill="#5a5049">Mouth sprites (mouth/)</text>
  <text x="76" y="351" font-size="13" fill="#7a6f68">・closed / half / open (3 images)</text>
  <text x="76" y="373" font-size="13" fill="#7a6f68">・switched by voice volume</text>

  <!-- ============ Voice ============ -->
  <rect x="48" y="410" width="300" height="105" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <text x="66" y="442" font-size="17" fill="#3f3833" font-weight="bold">Voice (audio)</text>
  <text x="66" y="470" font-size="13" fill="#5a5049">In AG: the character's voice (TTS)</text>
  <text x="66" y="494" font-size="13" fill="#5a5049">Review player: dummy audio (no mic)</text>

  <!-- ============ MotionPNGPlayer (Electron) ============ -->
  <rect x="388" y="80" width="470" height="300" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <text x="406" y="114" font-size="18" fill="#3f3833" font-weight="bold">MotionPNGPlayer (Electron)</text>
  <text x="406" y="142" font-size="13" fill="#9a8f88">a transparent, frameless, always-on-top desktop window</text>
  <text x="406" y="176" font-size="14.5" fill="#5a5049">① Loop the transparent video in the back, wait for voice</text>
  <text x="422" y="199" font-size="13" fill="#7a6f68">the mouth stays closed while waiting</text>
  <text x="406" y="231" font-size="14.5" fill="#5a5049">② When voice arrives, pick the mouth shape by volume</text>
  <text x="422" y="254" font-size="13" fill="#7a6f68">quiet→closed / mid→half / loud→open (min 70 ms between switches)</text>
  <text x="406" y="286" font-size="14.5" fill="#5a5049">③ Playback position × fps → that frame's mouth position/size/tilt</text>
  <text x="406" y="318" font-size="14.5" fill="#5a5049">④ Draw the sprite over the video at that position/size/tilt</text>
  <text x="406" y="352" font-size="13" fill="#9a8f88">two layers — video and mouth — overlap inside the transparent window</text>

  <!-- ============ What You See on the Desktop ============ -->
  <rect x="898" y="80" width="350" height="340" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <text x="916" y="114" font-size="19" fill="#3f3833" font-weight="bold">On the Desktop</text>

  <rect x="918" y="130" width="310" height="180" rx="8" fill="none" stroke="#b8ada6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="984" y="146" width="170" height="140" rx="8" fill="#eef5ee" stroke="#9dbb9d" stroke-width="1.5"/>
  <rect x="1040" y="180" width="58" height="26" rx="6" fill="#fbeef3" stroke="#d98cab" stroke-width="1.5"/>
  <text x="1108" y="198" font-size="13" fill="#8c3a5c">← mouth sprite</text>
  <text x="1069" y="250" font-size="13" fill="#4e6a4e" text-anchor="middle">character</text>
  <text x="1069" y="270" font-size="13" fill="#4e6a4e" text-anchor="middle">(transparent video)</text>
  <text x="934" y="300" font-size="13" fill="#9a8f88">desktop (wallpaper, other windows)</text>

  <text x="916" y="336" font-size="13" fill="#5a5049">Only the character's silhouette floats there —</text>
  <text x="916" y="358" font-size="13" fill="#5a5049">no rectangular window frame is visible</text>
  <text x="916" y="388" font-size="13.5" fill="#8c3a5c" font-weight="bold">Even in silence, hair and body keep swaying;</text>
  <text x="916" y="410" font-size="13.5" fill="#8c3a5c" font-weight="bold">when the voice arrives, the lips start moving</text>

  <!-- Arrows -->
  <line x1="348" y1="112" x2="384" y2="112" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>
  <polyline points="348,462 470,462 470,384" fill="none" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Arrow labels (white halo; drawn last) -->
  <text x="366" y="104" font-size="13" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">assets</text>
  <text x="408" y="454" font-size="13" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">volume</text>
</svg>
