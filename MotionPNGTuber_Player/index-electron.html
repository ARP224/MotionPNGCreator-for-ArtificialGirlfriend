<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionPNGTuber Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            /* Removed -webkit-app-region: drag to allow custom context menu */
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #base-video, #back-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            pointer-events: none;
        }

        #base-video {
            z-index: 1;
        }

        #back-video {
            z-index: 0;
            visibility: hidden;
        }

        #mouth-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-family: sans-serif;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .loading.hidden {
            display: none;
        }

        /* Error message */
        .error-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        /* Debug info (hidden by default) */
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 5px 10px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 10px;
            pointer-events: none;
            display: none;
        }

        .debug-info.visible {
            display: block;
        }

        /* Resize slider */
        .resize-slider-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 100;
            -webkit-app-region: no-drag;
        }

        .resize-slider-container.visible {
            display: flex;
        }

        .resize-slider-container label {
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            white-space: nowrap;
        }

        .resize-slider {
            width: 120px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .resize-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #4CAF50;
            border-radius: 50%;
            cursor: pointer;
        }

        .resize-slider::-webkit-slider-thumb:hover {
            background: #66BB6A;
        }

        .resize-value {
            color: white;
            font-family: monospace;
            font-size: 12px;
            min-width: 40px;
            text-align: right;
        }

        .resize-close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            margin-left: 5px;
        }

        .resize-close-btn:hover {
            color: white;
        }

        .video-name-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 11px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 80%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .video-name-overlay.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <video id="base-video" playsinline muted></video>
        <video id="back-video" playsinline muted></video>
        <canvas id="mouth-canvas"></canvas>
        <div class="loading" id="loading">Loading...</div>
        <div class="error-message" id="error-message"></div>
        <div class="video-name-overlay" id="video-name-overlay"></div>
        <div class="debug-info" id="debug-info"></div>
        <div class="resize-slider-container" id="resize-slider-container">
            <label>Size:</label>
            <input type="range" class="resize-slider" id="resize-slider" min="30" max="200" value="100">
            <span class="resize-value" id="resize-value">100%</span>
            <button class="resize-close-btn" id="resize-close-btn" title="Close">&#x2715;</button>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="lipsync.js"></script>
    <script src="multi-motion.js"></script>
    <script src="ws-review.js"></script>
    <script>
    /**
     * MotionPNGTuber Player - Electron Renderer Entry Point
     */
    (function() {
        'use strict';

        // DOM Elements
        const stageEl = document.getElementById('stage');
        const videoEl = document.getElementById('base-video');
        const canvasEl = document.getElementById('mouth-canvas');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error-message');
        const debugEl = document.getElementById('debug-info');
        const resizeSliderContainer = document.getElementById('resize-slider-container');
        const resizeSlider = document.getElementById('resize-slider');
        const resizeValue = document.getElementById('resize-value');
        const resizeCloseBtn = document.getElementById('resize-close-btn');

        // State
        let lipsyncEngine = null;
        let multiMotionManager = null;
        let reviewWSClient = null;
        let isInitialized = false;
        let resizeSliderVisible = false;
        const videoNameOverlay = document.getElementById('video-name-overlay');

        // Show/hide loading
        function setLoading(show, message = 'Loading...') {
            loadingEl.textContent = message;
            loadingEl.classList.toggle('hidden', !show);
        }

        // Show error
        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.add('visible');
            setTimeout(() => errorEl.classList.remove('visible'), 5000);
        }

        // Update debug info
        function updateDebug(info) {
            debugEl.textContent = info;
        }

        // Right-click context menu is handled in the main process ('context-menu' event)

        // Resize slider handlers
        // Use 'input' for visual feedback only, 'change' for actual resize
        resizeSlider.addEventListener('input', (e) => {
            const scalePercent = parseInt(e.target.value);
            resizeValue.textContent = scalePercent + '%';
        });

        resizeSlider.addEventListener('change', (e) => {
            const scalePercent = parseInt(e.target.value);
            const scale = scalePercent / 100;
            if (window.electronAPI) {
                window.electronAPI.setScale(scale);
            }
        });

        // Close button for resize slider
        resizeCloseBtn.addEventListener('click', () => {
            resizeSliderVisible = false;
            resizeSliderContainer.classList.remove('visible');
        });

        // Toggle resize slider from menu
        if (window.electronAPI) {
            window.electronAPI.onToggleResizeSlider((scale) => {
                resizeSliderVisible = !resizeSliderVisible;
                resizeSliderContainer.classList.toggle('visible', resizeSliderVisible);
                if (resizeSliderVisible) {
                    const scalePercent = Math.round(scale * 100);
                    resizeSlider.value = scalePercent;
                    resizeValue.textContent = scalePercent + '%';
                }
            });

            window.electronAPI.onScaleChanged((scale) => {
                const scalePercent = Math.round(scale * 100);
                resizeSlider.value = scalePercent;
                resizeValue.textContent = scalePercent + '%';
            });
        }

        // Scroll wheel handler for resizing
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (window.electronAPI) {
                const delta = e.deltaY > 0 ? -0.05 : 0.05;
                window.electronAPI.resizeWindow(delta);
            }
        }, { passive: false });

        // Window drag handler (left-click + drag)
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        document.addEventListener('mousedown', (e) => {
            // Only left-click, and not on interactive elements
            if (e.button === 0 && !e.target.closest('.resize-slider-container')) {
                isDragging = true;
                dragStartX = e.screenX;
                dragStartY = e.screenY;
                if (window.electronAPI) {
                    window.electronAPI.startDrag();
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging && window.electronAPI) {
                const deltaX = e.screenX - dragStartX;
                const deltaY = e.screenY - dragStartY;
                window.electronAPI.dragWindow(deltaX, deltaY);
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Show video name overlay (fade in, then auto-hide after 3s)
        function showVideoName(name) {
            if (!videoNameOverlay) return;
            videoNameOverlay.textContent = name;
            videoNameOverlay.classList.add('visible');
            if (videoNameOverlay._hideTimer) clearTimeout(videoNameOverlay._hideTimer);
            videoNameOverlay._hideTimer = setTimeout(() => {
                videoNameOverlay.classList.remove('visible');
            }, 3000);
        }

        // Initialize application
        async function init(wsPort, characterFolder, playlistPath) {
            console.log('[App] Initializing folder:', characterFolder, 'playlist:', playlistPath);
            setLoading(true, 'Loading character...');

            try {
                // Create LipsyncEngine (shared by all modes)
                lipsyncEngine = new LipsyncEngine({
                    elements: {
                        video: videoEl,
                        mouthCanvas: canvasEl,
                        stage: stageEl
                    },
                    callbacks: {
                        onLog: (msg) => console.log('[Lipsync]', msg),
                        onFileStatus: (status, msg) => {
                            console.log('[Lipsync Status]', status, msg);
                            // lipsync.js は AG の MotionPNGPlayer と同一ファイル（生ログ層は英語）。
                            // 表示層で翻訳済みの見出しを被せ、英語の詳細を {message} に入れる
                            if (status === 'error') showError(t('player.load_failed', { message: msg }));
                        },
                        onVolumeChange: (vol) => {},
                        onPlayStateChange: (isPlaying) => {
                            console.log('[Lipsync] Playing:', isPlaying);
                        },
                        onError: (msg) => showError(t('player.engine_error', { message: msg }))
                    },
                    options: {
                        debug: false,
                        hqAudioEnabled: true,  // ArtificialGirlfriend側と同一設定
                        sensitivity: 50
                    }
                });

                if (playlistPath) {
                    // --- Playlist review mode ---
                    console.log('[App] Playlist review mode');
                    await initPlaylistMode(playlistPath, wsPort);
                } else if (characterFolder) {
                    // Try single-asset mode first (preview from GUI)
                    const singleResult = await window.electronAPI.loadSingleAsset(characterFolder);

                    if (!singleResult.error) {
                        // --- Single asset preview mode ---
                        console.log('[App] Single asset mode');
                        await initSingleAsset(singleResult);
                    } else {
                        // --- Multi-motion mode (original) ---
                        console.log('[App] Multi-motion mode');
                        const result = await window.electronAPI.loadCharacterFolder(characterFolder);
                        if (result.error) throw new Error(result.error);
                        if (!result.motions || result.motions.length === 0) {
                            // 両モードのエラーを区別して表示
                            throw new Error(
                                'Multi-motion: no valid motions found / ' +
                                'Single-asset: ' + singleResult.error
                            );
                        }
                        await initMultiMotion(result);
                    }
                } else {
                    throw new Error('No character folder or playlist specified');
                }

                setLoading(false);
                isInitialized = true;
                console.log('[App] Initialization complete');

            } catch (error) {
                console.error('[App] Initialization failed:', error);
                setLoading(false);
                showError('Initialization failed: ' + error.message);
            }
        }

        // Playlist review mode
        async function initPlaylistMode(playlistPath, wsPort) {
            const result = await window.electronAPI.loadPlaylist(playlistPath);
            if (result.error) throw new Error('Playlist load failed: ' + result.error);
            if (!result.motions || result.motions.length === 0) {
                throw new Error('No valid videos in playlist');
            }

            // Init MultiMotionManager in sequential mode
            multiMotionManager = new MultiMotionManager(lipsyncEngine);
            multiMotionManager.playbackMode = 'sequential';
            await multiMotionManager.init(result.motions);

            // Set window size from first track
            const trackData = multiMotionManager.getCurrentTrackData();
            if (trackData && trackData.width && trackData.height) {
                let w = trackData.width, h = trackData.height;
                if (h > 800) { const r = 800 / h; w = Math.round(w * r); h = 800; }
                window.electronAPI.setBaseSize(w, h);
            }

            // Connect WS client for review commands
            if (wsPort) {
                reviewWSClient = new ReviewWSClient(wsPort, {
                    // 接続確立時に現在の再生動画を即通知する
                    // （now_playingはモーション切替時にしか飛ばないため、
                    //  初回再生分はここで送らないとPython側が把握できない）
                    onConnected: () => {
                        const cur = multiMotionManager.getCurrentMotionName();
                        if (cur && reviewWSClient) {
                            reviewWSClient.sendNowPlaying(cur);
                        }
                    },
                    onGoto: async (name) => {
                        console.log('[App] WS goto:', name);
                        // 成功時の now_playing は onMotionChanged に一本化。
                        // 失敗時（遷移中に破棄された等）は実際に再生中の名前を
                        // 送り返し、Python側のハイライトを実態に同期させる
                        const switched = await multiMotionManager.switchToMotionByName(name);
                        if (!switched) {
                            console.warn('[App] WS goto failed:', name);
                            const actual = multiMotionManager.getCurrentMotionName();
                            if (actual && reviewWSClient) {
                                reviewWSClient.sendNowPlaying(actual);
                            }
                        }
                    },
                    onRemove: (name) => {
                        console.log('[App] WS remove:', name);
                        const result = multiMotionManager.removeMotionByName(name);
                        if (reviewWSClient) {
                            reviewWSClient.sendRemoved(name, result.ok, result.reason);
                        }
                    },
                    onStop: () => {
                        window.close();
                    }
                });
                reviewWSClient.connect();
            }

            // Hook motion changes to notify Python + show overlay
            multiMotionManager.onMotionChanged = (name) => {
                showVideoName(name);
                if (reviewWSClient) reviewWSClient.sendNowPlaying(name);
            };

            // Start playback
            multiMotionManager.startPlaying();

            // Dummy mouth animation: 3s talking, 3s silence, repeat
            // ArtificialGirlfriend側のAudioWorkletは約60Hzで解析データを送るため、
            // ここも同じレートで駆動する（lipsync.jsの平滑化係数は60Hz前提）
            const dummyCycle = 6000;  // 6s total (3s on + 3s off)
            const dummyStart = performance.now();
            let dummyRatio = 0.5;  // 母音比率はランダムウォークで緩やかに変化させる
            setInterval(() => {
                if (!lipsyncEngine) return;
                const now = performance.now();
                const t = (now - dummyStart) / 1000;
                const elapsed = (now - dummyStart) % dummyCycle;
                if (elapsed < 3000) {
                    // Talking phase: 音節風エンベロープ(約4Hz) × フレーズ抑揚 × 微小ノイズ
                    const syllable = Math.max(0, Math.sin(2 * Math.PI * 4 * t));
                    const phrase = 0.6 + 0.4 * Math.sin(2 * Math.PI * 0.35 * t);
                    const noise = 0.85 + Math.random() * 0.3;
                    const rms = 0.12 * syllable * phrase * noise;
                    dummyRatio += (Math.random() - 0.5) * 0.08;
                    dummyRatio = Math.min(0.85, Math.max(0.15, dummyRatio));
                    lipsyncEngine.processAudioData({ rms, high: dummyRatio, low: 1 - dummyRatio });
                } else {
                    // Silent phase
                    lipsyncEngine.processAudioData({ rms: 0, high: 0, low: 0 });
                }
            }, 16);

            // Show initial video name
            const initialName = multiMotionManager.getCurrentMotionName();
            if (initialName) showVideoName(initialName);
            if (reviewWSClient && initialName) reviewWSClient.sendNowPlaying(initialName);
        }

        // Single asset preview mode (launched from GUI)
        async function initSingleAsset(asset) {
            // Build file paths
            function buildPath(p, file) {
                const full = file ? (p + '/' + file).replace(/\\/g, '/') : p.replace(/\\/g, '/');
                return 'local://' + full;
            }

            // Load video
            const videoSrc = buildPath(asset.videoPath);
            await lipsyncEngine._setupVideo(videoSrc, false);

            // Load track data
            const trackResult = await window.electronAPI.readFile(asset.trackPath);
            if (trackResult.error) throw new Error('Track read failed: ' + trackResult.error);
            const trackData = JSON.parse(trackResult.content);
            await lipsyncEngine._setupTrackData(trackData);

            // Load mouth sprites
            const spriteSources = {};
            for (const sprite of asset.availableSprites) {
                const name = sprite.replace('.png', '');
                spriteSources[name] = buildPath(asset.mouthPath, sprite);
            }
            await lipsyncEngine._loadMouthSprites(spriteSources);

            // Set window size
            if (trackData.width && trackData.height) {
                let w = trackData.width, h = trackData.height;
                if (h > 800) { const r = 800 / h; w = Math.round(w * r); h = 800; }
                window.electronAPI.setBaseSize(w, h);
            }

            // Preview mode: loop video with closed mouth, no audio.
            // lipsyncEngine.start() は描画ループの開始のみ。動画の再生は呼び出し側で行う
            // （AG と同一の lipsync.js に合わせた。multi-motion 経路は _startVideoPlayback が担当）
            lipsyncEngine.setMouthState('closed', true);
            videoEl.loop = true;
            videoEl.currentTime = 0;
            videoEl.play().catch((error) => console.error('[Preview] Video play error:', error));
            lipsyncEngine.start();
        }

        // Multi-motion mode (original behavior)
        async function initMultiMotion(result) {
            multiMotionManager = new MultiMotionManager(lipsyncEngine);
            await multiMotionManager.init(result.motions);

            const trackData = multiMotionManager.getCurrentTrackData();
            if (trackData && trackData.width && trackData.height) {
                let w = trackData.width, h = trackData.height;
                if (h > 800) { const r = 800 / h; w = Math.round(w * r); h = 800; }
                window.electronAPI.setBaseSize(w, h);
            }

            multiMotionManager.startPlaying();
        }

        // Wait for electronAPI to be ready
        if (window.electronAPI) {
            window.electronAPI.onInit((data) => {
                console.log('[App] Received init data:', data);
                init(data.wsPort, data.characterFolder, data.playlistPath);
            });
        } else {
            console.error('[App] electronAPI not available');
            showError('Electron API not available');
        }

        // Test mouth animation (external control)
        let testMouthInterval = null;
        const mouthStates = ['closed', 'open', 'half', 'open', 'e', 'open', 'u', 'open'];
        let mouthStateIdx = 0;
        if (window.electronAPI && window.electronAPI.onTestMouth) {
            window.electronAPI.onTestMouth((enabled) => {
                if (enabled) {
                    console.log('[App] Test mouth: ON');
                    mouthStateIdx = 0;
                    testMouthInterval = setInterval(() => {
                        const state = mouthStates[mouthStateIdx % mouthStates.length];
                        mouthStateIdx++;
                        if (typeof lipsyncEngine !== 'undefined' && lipsyncEngine) {
                            lipsyncEngine.setMouthState(state, true);
                        }
                    }, 150);
                } else {
                    console.log('[App] Test mouth: OFF');
                    if (testMouthInterval) {
                        clearInterval(testMouthInterval);
                        testMouthInterval = null;
                    }
                    if (typeof lipsyncEngine !== 'undefined' && lipsyncEngine) {
                        lipsyncEngine.setMouthState('closed', true);
                    }
                }
            });
        }

        // Keyboard shortcuts for debugging
        document.addEventListener('keydown', (e) => {
            // D key: Toggle debug info
            if (e.key === 'd' || e.key === 'D') {
                debugEl.classList.toggle('visible');
            }
            // R key: Reload
            if (e.key === 'r' || e.key === 'R') {
                location.reload();
            }
        });

        // Global error handler for debugging
        window.onerror = (msg, url, line, col, error) => {
            console.error('[Global Error]', msg, 'at', url, 'line', line);
            showError('Error: ' + msg);
            return false;
        };

        window.onunhandledrejection = (event) => {
            // AbortError from video play() is expected during transitions
            if (event.reason && event.reason.name === 'AbortError') {
                event.preventDefault();
                return;
            }
            console.error('[Unhandled Rejection]', event.reason);
            showError('Async Error: ' + event.reason);
        };
    })();
    </script>
</body>
</html>
